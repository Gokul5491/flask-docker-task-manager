<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>
</head>

<body>

    <h1>Task Manager</h1>

    <form action="/add" method="POST">
        <input type="text" name="task" placeholder="Enter a task">
        <button type="submit">Add Task</button>
    </form>

    <h2>Tasks</h2>

    <<ul>
    {% for task in tasks %}
        <li>
            {{ task[1] }}
            <a href="/delete/{{ task[0] }}">Delete</a>
        </li>
    {% endfor %}
</ul>

</body>
</html>
